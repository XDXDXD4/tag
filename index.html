<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TAG — Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif}
body{background:#5bb8f5}

/* ── SCREENS ── */
.scr{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;gap:16px;
  background:linear-gradient(175deg,#5bb8f5 0%,#7dd4f5 100%)}
.scr.on{display:flex}

/* ── TITLE ── */
.gtitle{font-family:'Lilita One',cursive;font-size:clamp(60px,13vw,108px);color:#fff;
  text-shadow:-3px -3px 0 #222,3px -3px 0 #222,-3px 3px 0 #222,3px 3px 0 #222,0 6px 0 rgba(0,0,0,.18);
  letter-spacing:4px;line-height:1;text-align:center}
.gsub{font-size:13px;font-weight:900;letter-spacing:4px;color:rgba(255,255,255,.88);
  text-transform:uppercase;margin-top:-4px;text-align:center}

/* ── CARD ── */
.card{background:rgba(255,255,255,.96);border-radius:20px;padding:24px;
  width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.1)}

/* ── MODE BUTTONS ── */
.modeBtns{display:flex;gap:12px;width:100%;max-width:440px}
.modeBtn{flex:1;border:none;border-radius:18px;padding:22px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .15s,box-shadow .15s;font-family:'Nunito',sans-serif}
.modeBtn:hover{transform:translateY(-4px)}
.modeBtn .micon{font-size:36px}
.modeBtn .mlabel{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.modeBtn .msub{font-size:11px;font-weight:700;opacity:.75;text-align:center}
.modeBtn.online{background:#e8547a;color:white;box-shadow:0 6px 0 #c03a60,0 8px 20px rgba(232,84,122,.4)}
.modeBtn.local {background:#ffd24a;color:#333;box-shadow:0 6px 0 #d4a800,0 8px 20px rgba(255,210,74,.4)}

/* ── TABS ── */
.tabs{display:flex;gap:8px}
.tb{flex:1;background:#eef;border:none;border-radius:10px;color:#778;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;padding:10px;cursor:pointer;transition:all .2s}
.tb.on{background:#e8547a;color:#fff;box-shadow:0 4px 12px rgba(232,84,122,.4)}
.panel{display:none;flex-direction:column;gap:12px}.panel.on{display:flex}

/* ── INPUTS ── */
.ir{display:flex;flex-direction:column;gap:5px}
.ir label{font-size:10px;font-weight:900;letter-spacing:2px;color:#889;text-transform:uppercase}
input[type=text]{background:#f4f6ff;border:2px solid #dde;border-radius:10px;color:#334;
  font-family:'Nunito',sans-serif;font-size:18px;font-weight:700;padding:9px 13px;
  outline:none;transition:border-color .2s;width:100%}
input:focus{border-color:#e8547a}

/* ── ADJUSTER ── */
.adj{display:flex;align-items:center;gap:10px}
.aBtn{width:34px;height:34px;background:#eef;border:2px solid #dde;border-radius:8px;
  color:#667;font-size:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .15s;user-select:none;line-height:1}
.aBtn:hover{background:#e8547a;border-color:#e8547a;color:#fff}
.aVal{font-size:22px;font-weight:900;color:#e8547a;min-width:28px;text-align:center}

/* ── BUTTONS ── */
.btn{background:#e8547a;color:#fff;border:none;border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;letter-spacing:1px;
  padding:13px;cursor:pointer;text-transform:uppercase;width:100%;
  box-shadow:0 4px 0 #c03a60,0 6px 16px rgba(232,84,122,.35);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c03a60,0 8px 20px rgba(232,84,122,.45)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c03a60}
.btn:disabled{background:#bcc;box-shadow:0 4px 0 #9aa;opacity:.65;cursor:not-allowed;transform:none}
.btn.blue{background:#4fc3f7;box-shadow:0 4px 0 #2a9cc7,0 6px 16px rgba(79,195,247,.4)}
.btn.blue:hover{box-shadow:0 6px 0 #2a9cc7,0 8px 20px rgba(79,195,247,.5)}
.btn.blue:active{box-shadow:0 2px 0 #2a9cc7}
.btn.green{background:#5cb85c;box-shadow:0 4px 0 #3d8b3d,0 6px 16px rgba(92,184,92,.4)}
.btn.green:not(:disabled):hover{box-shadow:0 6px 0 #3d8b3d,0 8px 20px rgba(92,184,92,.5)}
.btn.green:active{box-shadow:0 2px 0 #3d8b3d}
.btn.yellow{background:#ffd24a;color:#333;box-shadow:0 4px 0 #d4a800,0 6px 16px rgba(255,210,74,.4)}

.sb{font-size:12px;font-weight:700;min-height:18px;text-align:center;color:#e8547a}
.sb.inf{color:#4fc3f7}.sb.ok{color:#5cb85c}

/* ── CONN DOT ── */
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ccc;
  margin-right:5px;vertical-align:middle;transition:background .3s}
.cdot.on{background:#5cb85c;box-shadow:0 0 8px #5cb85c}
.cdot.wait{background:#ffd24a;animation:plz 1s ease infinite}
@keyframes plz{0%,100%{opacity:1}50%{opacity:.25}}

/* ── LOCAL PLAYER SELECT ── */
.pCount{display:flex;gap:10px;justify-content:center}
.pcBtn{width:80px;height:80px;border:3px solid #dde;border-radius:16px;background:#f4f6ff;
  font-family:'Lilita One',cursive;font-size:28px;color:#889;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:all .2s}
.pcBtn:hover,.pcBtn.on{border-color:#ffd24a;background:#fff9e6;color:#333;
  box-shadow:0 4px 0 #d4a800,0 6px 16px rgba(255,210,74,.3);transform:translateY(-3px)}
.pcBtn span{font-size:10px;font-weight:900;letter-spacing:1px}

/* ── CONTROLS TABLE ── */
.ctrlTable{width:100%;border-collapse:separate;border-spacing:0 4px}
.ctrlTable td{padding:5px 8px;font-size:12px;font-weight:700}
.ctrlTable td:first-child{border-radius:6px 0 0 6px}
.ctrlTable td:last-child{border-radius:0 6px 6px 0}
.ctrlRow td{background:rgba(255,255,255,.7)}
.ctrlKey{display:inline-block;background:#334;color:#fff;border-radius:4px;
  padding:1px 5px;font-size:11px;font-family:monospace;margin:0 1px}

/* ── MAP SELECT ── */
.mapTitle{font-family:'Lilita One',cursive;font-size:26px;color:#fff;
  text-shadow:-2px -2px 0 #222,2px -2px 0 #222,-2px 2px 0 #222,2px 2px 0 #222}
.mapGrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:440px}
.mapCard{width:130px;border-radius:14px;overflow:hidden;cursor:pointer;
  border:3px solid transparent;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mapCard.sel{border-color:#ffd24a;transform:translateY(-5px);
  box-shadow:0 10px 24px rgba(0,0,0,.25),0 0 0 3px #ffd24a}
.mapCard .mt{height:75px;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:6px;font-size:28px;position:relative;overflow:hidden}
.mapCard .mn{text-align:center;font-size:12px;font-weight:900;padding:7px;
  letter-spacing:1px;text-transform:uppercase}

/* ── LOBBY ── */
.ltitle{font-family:'Lilita One',cursive;font-size:32px;color:#fff;
  text-shadow:-2px -2px 0 #222,2px -2px 0 #222,-2px 2px 0 #222,2px 2px 0 #222}
.codeBox{background:rgba(255,255,255,.95);border-radius:16px;padding:14px 22px;
  text-align:center;width:100%;max-width:440px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.clbl{font-size:10px;font-weight:900;letter-spacing:3px;color:#889;text-transform:uppercase}
.crow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.cdisp{font-family:'Lilita One',cursive;font-size:48px;color:#e8547a;letter-spacing:8px;
  text-shadow:0 3px 0 #c03a60}
.cpyBtn{background:#eef;border:2px solid #dde;border-radius:8px;color:#667;cursor:pointer;
  padding:6px 10px;font-size:11px;font-family:'Nunito',sans-serif;font-weight:900;
  letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.cpyBtn:hover{background:#e8547a;border-color:#e8547a;color:#fff}
.pgrid{width:100%;max-width:440px;display:flex;flex-direction:column;gap:6px}
.pct{font-size:10px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.8);text-transform:uppercase;margin-bottom:2px}
.pslot{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:10px;font-size:14px;font-weight:800}
.pslot.f{background:rgba(255,255,255,.9);color:#334}
.pslot.e{background:rgba(255,255,255,.3);color:rgba(255,255,255,.6);font-style:italic}
.pdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.1)}
.pbadge{margin-left:auto;font-size:9px;font-weight:900;background:#ffd24a;color:#333;border-radius:4px;padding:2px 6px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}

/* ── COUNTDOWN ── */
#cntScr{background:linear-gradient(175deg,#5bb8f5 0%,#7dd4f5 100%)}
.bigN{font-family:'Lilita One',cursive;font-size:clamp(100px,25vw,200px);color:#fff;
  text-shadow:-4px -4px 0 #222,4px -4px 0 #222,-4px 4px 0 #222,4px 4px 0 #222,0 8px 0 rgba(0,0,0,.15);
  animation:si .35s cubic-bezier(.34,1.56,.64,1)}
.goT{font-family:'Lilita One',cursive;font-size:clamp(60px,15vw,120px);color:#ffd24a;
  text-shadow:-3px -3px 0 #222,3px -3px 0 #222,-3px 3px 0 #222,3px 3px 0 #222,0 6px 0 rgba(0,0,0,.15);
  animation:si .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes si{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* ── GAME ── */
#gameScr{position:fixed;inset:0;display:none;z-index:10;overflow:hidden}
#gameCanvas{display:block;position:absolute;top:0;left:0}

/* ── HUD ── */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:none;
  align-items:center;justify-content:space-between;padding:8px 14px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
  border-bottom:2px solid rgba(255,255,255,.5)}
.hudL{display:flex;align-items:center;gap:10px}
#timeTxt{font-family:'Lilita One',cursive;font-size:22px;color:#e8547a;
  text-shadow:-1px -1px 0 #222,1px -1px 0 #222,-1px 1px 0 #222,1px 1px 0 #222}
.hudScores{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hsc{font-size:12px;font-weight:900;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.7);color:#334;border:2px solid transparent}
.hsc.me{border-color:#e8547a;color:#e8547a}
#timeFill{position:fixed;top:0;left:0;height:4px;z-index:21;
  transition:width .1s linear;background:linear-gradient(90deg,#e8547a,#ffd24a)}

/* ── END ── */
#endScr{background:linear-gradient(175deg,#5bb8f5 0%,#7dd4f5 100%)}
.endTitle{font-family:'Lilita One',cursive;font-size:clamp(38px,9vw,72px);color:#fff;
  text-shadow:-3px -3px 0 #222,3px -3px 0 #222,-3px 3px 0 #222,3px 3px 0 #222;text-align:center}
.sbrd{width:100%;max-width:400px;display:flex;flex-direction:column;gap:7px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,.9);font-size:14px;font-weight:800;color:#334}
.srow.win{background:#fff;border:3px solid #ffd24a;box-shadow:0 4px 16px rgba(255,210,74,.4)}
.srank{font-size:20px;min-width:34px;text-align:center}
.sname{flex:1}.stag{font-size:12px;font-weight:800;color:#889}

.note{font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-align:center;
  letter-spacing:1px;max-width:400px;line-height:1.6}
.back{background:none;border:2px solid rgba(255,255,255,.5);color:rgba(255,255,255,.85);
  border-radius:8px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:12px;
  font-weight:900;letter-spacing:1px;cursor:pointer;text-transform:uppercase;
  position:absolute;top:16px;left:16px;transition:all .2s}
.back:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>

<!-- ═══ MODE SELECT ═══ -->
<div id="modeScr" class="scr on">
  <div><div class="gtitle">TAG</div><div class="gsub">Multiplayer</div></div>
  <div class="modeBtns">
    <button class="modeBtn local" id="localModeBtn">
      <span class="micon">🎮</span>
      <span class="mlabel">Local</span>
      <span class="msub">Same computer,<br>split keyboard</span>
    </button>
    <button class="modeBtn online" id="onlineModeBtn">
      <span class="micon">🌐</span>
      <span class="mlabel">Online</span>
      <span class="msub">Play with friends<br>anywhere</span>
    </button>
  </div>
  <p class="note">No downloads · No accounts · Works on school networks</p>
</div>

<!-- ═══ LOCAL SETUP ═══ -->
<div id="localScr" class="scr" style="position:relative">
  <button class="back" id="backLocal">← Back</button>
  <div style="text-align:center">
    <div class="gtitle" style="font-size:clamp(40px,8vw,70px)">LOCAL</div>
    <div class="gsub">Same keyboard multiplayer</div>
  </div>
  <div class="card">
    <div class="ir"><label>How many players?</label></div>
    <div class="pCount">
      <button class="pcBtn" data-n="2">2<span>Players</span></button>
      <button class="pcBtn" data-n="3">3<span>Players</span></button>
      <button class="pcBtn" data-n="4">4<span>Players</span></button>
    </div>
    <div class="ir"><label>Controls</label>
      <table class="ctrlTable" id="ctrlTbl"></table>
    </div>
    <div class="ir"><label>Game Duration</label>
      <div class="adj">
        <button class="aBtn" id="ldMin">−</button>
        <span class="aVal" id="ldV">3</span>
        <button class="aBtn" id="ldMax">+</button>
        <span style="color:#889;font-size:12px;font-weight:700">minutes</span>
      </div>
    </div>
  </div>
  <button class="btn yellow" id="localNextBtn" style="max-width:440px">CHOOSE MAP →</button>
</div>

<!-- ═══ ONLINE SETUP ═══ -->
<div id="onlineScr" class="scr" style="position:relative">
  <button class="back" id="backOnline">← Back</button>
  <div style="text-align:center">
    <div class="gtitle" style="font-size:clamp(40px,8vw,70px)">ONLINE</div>
    <div class="gsub">Play with friends</div>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:900;color:#889">
      <span class="cdot" id="cdot"></span><span id="clabel">Connecting…</span>
    </div>
    <div class="tabs">
      <button class="tb on" id="tabH">🎮 Host</button>
      <button class="tb"    id="tabJ">🔗 Join</button>
    </div>
    <div class="panel on" id="pH">
      <div class="ir"><label>Your Name</label>
        <input type="text" id="hName" placeholder="Enter your name…" maxlength="14"></div>
      <div class="ir"><label>Max Players</label>
        <div class="adj">
          <button class="aBtn" id="mMin">−</button>
          <span class="aVal" id="mV">4</span>
          <button class="aBtn" id="mMax">+</button>
          <span style="color:#889;font-size:12px;font-weight:700">(2–8 players)</span>
        </div>
      </div>
      <div class="ir"><label>Game Duration</label>
        <div class="adj">
          <button class="aBtn" id="odMin">−</button>
          <span class="aVal" id="odV">3</span>
          <button class="aBtn" id="odMax">+</button>
          <span style="color:#889;font-size:12px;font-weight:700">minutes</span>
        </div>
      </div>
      <button class="btn" id="hostBtn">CREATE ROOM</button>
    </div>
    <div class="panel" id="pJ">
      <div class="ir"><label>Your Name</label>
        <input type="text" id="jName" placeholder="Enter your name…" maxlength="14"></div>
      <div class="ir"><label>Room Code</label>
        <input type="text" id="jCode" placeholder="XXXX" maxlength="4"
          style="font-size:32px;letter-spacing:12px;text-align:center;font-weight:900"></div>
      <button class="btn blue" id="joinBtn">JOIN ROOM</button>
    </div>
    <p class="sb" id="sSb"></p>
  </div>
</div>

<!-- ═══ MAP SELECT ═══ -->
<div id="mapScr" class="scr" style="position:relative">
  <button class="back" id="backMap">← Back</button>
  <div class="mapTitle">Choose Map</div>
  <div class="mapGrid" id="mapGrid"></div>
  <button class="btn green" id="mapNextBtn" style="max-width:440px">LET'S GO! →</button>
</div>

<!-- ═══ LOBBY (online only) ═══ -->
<div id="lobbyScr" class="scr" style="position:relative">
  <button class="back" id="backLobby">← Back</button>
  <div class="ltitle">LOBBY</div>
  <div class="codeBox">
    <div class="clbl">Share this code with friends!</div>
    <div class="crow">
      <span class="cdisp" id="lobbyCode">----</span>
      <button class="cpyBtn" id="cpyBtn">COPY</button>
    </div>
  </div>
  <div class="pgrid">
    <div class="pct" id="pct">0 / 4 Players</div>
    <div id="pList"></div>
  </div>
  <div class="hrow" id="hCtrls" style="display:none">
    <span style="font-size:11px;font-weight:900;color:rgba(255,255,255,.8);letter-spacing:1px">MAX:</span>
    <button class="aBtn" id="lMin">−</button>
    <span class="aVal" id="lMV" style="color:#fff">4</span>
    <button class="aBtn" id="lMax">+</button>
  </div>
  <div id="startWrap" style="display:none;width:100%;max-width:440px">
    <button class="btn green" id="startBtn" disabled>WAITING FOR PLAYERS…</button>
  </div>
  <p class="sb inf" id="lSb">Waiting for players to join…</p>
</div>

<!-- ═══ COUNTDOWN ═══ -->
<div id="cntScr" class="scr"><div id="cntC"></div></div>

<!-- ═══ GAME ═══ -->
<div id="gameScr">
  <div id="timeFill" style="width:100%"></div>
  <div id="hud">
    <div class="hudL">
      <span id="timeTxt">3:00</span>
    </div>
    <div class="hudScores" id="hudSc"></div>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<!-- ═══ END ═══ -->
<div id="endScr" class="scr">
  <div class="endTitle" id="endTitle">GAME OVER</div>
  <div class="sbrd" id="sbrd"></div>
  <div style="display:flex;gap:10px;width:100%;max-width:400px;flex-wrap:wrap">
    <button class="btn green" id="playAgainBtn" style="flex:1">PLAY AGAIN</button>
    <button class="btn" id="menuBtn" style="flex:0 0 110px">MENU</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  WORLD DIMENSIONS
// ══════════════════════════════════════════════════════════════
const WW = 960;   // world width
const WH = 1600;  // world height (tall!)
const GROUND_Y = WH - 80;

// ══════════════════════════════════════════════════════════════
//  MAP DEFINITIONS  (all have many platforms)
// ══════════════════════════════════════════════════════════════
const MAPS = [
  // ── FOREST ──────────────────────────────────────────────────
  { name:'Forest', emoji:'🌲',
    sky0:'#5bb8f5', sky1:'#93d8f5',
    groundFill:'#e8547a', groundTop:'#6abf5e', groundBump:'#5aaf4e',
    platFill:'#e8547a',   platTop:'#6abf5e',   platShadow:'rgba(0,0,0,.2)',
    bgColor:'rgba(138,195,230,0.45)',
    platforms:[
      // ground strip
      {x:0,   y:GROUND_Y, w:WW,  h:200, ground:true},
      // layer 1 (low)
      {x:30,  y:GROUND_Y-95,  w:160, h:14},
      {x:280, y:GROUND_Y-110, w:140, h:14},
      {x:520, y:GROUND_Y-90,  w:130, h:14},
      {x:760, y:GROUND_Y-105, w:170, h:14},
      // layer 2
      {x:110, y:GROUND_Y-200, w:130, h:14},
      {x:360, y:GROUND_Y-215, w:150, h:14},
      {x:610, y:GROUND_Y-200, w:140, h:14},
      {x:820, y:GROUND_Y-195, w:120, h:14},
      // layer 3
      {x:20,  y:GROUND_Y-310, w:180, h:14},
      {x:270, y:GROUND_Y-330, w:130, h:14},
      {x:480, y:GROUND_Y-305, w:160, h:14},
      {x:740, y:GROUND_Y-320, w:145, h:14},
      // layer 4

//  MQTT
// ══════════════════════════════════════════════════════════════
function T(){return{
  state:`${NS}/${roomCode}/state`,join:`${NS}/${roomCode}/join`,
  start:`${NS}/${roomCode}/start`,leave:`${NS}/${roomCode}/leave`,
  posAll:`${NS}/${roomCode}/p/#`,tagged:`${NS}/${roomCode}/tagged`,
  end:`${NS}/${roomCode}/end`,
};}
const posT=id=>`${NS}/${roomCode}/p/${id}`;

function pub(topic,data,retain=false){
  if(!mqc?.connected)return;
  mqc.publish(topic,JSON.stringify(data),{qos:retain?1:0,retain});
}
function connectMQTT(cb){
  setDot('wait');
  mqc=mqtt.connect(BROKER,{clientId:myId,clean:true,reconnectPeriod:4000,connectTimeout:12000});
  mqc.on('connect',()=>{setDot('on');$('clabel').textContent='Connected!';cb?.();cb=null;});
  mqc.on('error',()=>{$('clabel').textContent='Error — retrying…';});
  mqc.on('offline',()=>{setDot('wait');$('clabel').textContent='Reconnecting…';});
  mqc.on('message',onMsg);
}
function subAll(){const t=T();[t.state,t.join,t.start,t.leave,t.posAll,t.tagged,t.end].forEach(tp=>mqc.subscribe(tp,{qos:0}));}

// ══════════════════════════════════════════════════════════════
//  MQTT MESSAGE HANDLER
// ══════════════════════════════════════════════════════════════
function onMsg(topic,raw){
  let d;try{d=JSON.parse(raw.toString());}catch{return;}
  const t=T(),pp=`${NS}/${roomCode}/p/`;

  if(topic.startsWith(pp)&&gStarted&&!gEnded){
    const pid=topic.slice(pp.length); if(pid===myId)return;
    if(!gs[pid]&&players[pid])initRemote(pid,d.x,d.y);
    if(gs[pid]){gs[pid].tx=d.x;gs[pid].ty=d.y;gs[pid].tvx=d.vx||0;
      gs[pid].isIt=d.isIt;gs[pid].score=d.score||0;gs[pid].fr=d.fr!==false;gs[pid].seen=Date.now();}
    return;
  }
  if(topic===t.state){
    players=d.players||{};maxPlayers=d.maxPlayers||4;selectedMap=d.mapIdx||0;
    if(!isHost&&!lobbyIn){
      lobbyIn=true;
      if(!players[myId])pub(t.join,{from:myId,name:myName,color:myColor});
      goLobby();
    }
    if(!gStarted)renderLobby();
    return;
  }
  if(topic===t.join&&isHost&&d.from!==myId){
    if(players[d.from]||Object.keys(players).length>=maxPlayers)return;
    players[d.from]={name:d.name,color:d.color,isHost:false};
    pub(t.state,lobbyPay(),true);renderLobby();return;
  }
  if(topic===t.start&&!gStarted){
    gStarted=true;itId=d.itPlayer;gameDur=d.duration;endTime=d.endTime;selectedMap=d.mapIdx||0;
    const order=d.order||{};
    Object.keys(players).forEach((id,i)=>{
      const p=players[id];if(p)spawnOnline(id,p.name,p.color,id===itId,i);
    });
    countdown(()=>beginGame());return;
  }
  if(topic===t.tagged){
    if(gs[d.from]){gs[d.from].isIt=false;gs[d.from].score=(gs[d.from].score||0)+1;}
    if(gs[d.to]){gs[d.to].isIt=true;gs[d.to].taggedAt=Date.now();}
    itId=d.to;return;
  }
  if(topic===t.leave&&d.from!==myId){
    delete players[d.from];delete gs[d.from];
    if(isHost&&!gStarted)pub(t.state,lobbyPay(),true);
    if(!gStarted)renderLobby();return;
  }
  if(topic===t.end){showEnd(d.scores);return;}
}

function hostRoom(){
  myName=$('hName').value.trim()||'Player 1';myColor=PCOLORS[0];
  isHost=true;roomCode=genCode();maxPlayers=localMax;gameDur=onlineDurVal;
  players[myId]={name:myName,color:myColor,isHost:true};
  setSb('sSb','');
  connectMQTT(()=>{subAll();pub(T().state,lobbyPay(),true);goLobby();});
}
function joinRoom(){
  myName=$('jName').value.trim()||'Player';
  myColor=PCOLORS[Math.floor(Math.random()*PCOLORS.length)];
  roomCode=$('jCode').value.trim().toUpperCase();
  if(roomCode.length!==4){setSb('sSb','Enter a 4-letter code!');return;}
  isHost=false;setSb('sSb','Connecting…','inf');
  connectMQTT(()=>{
    subAll();
    setTimeout(()=>pub(T().join,{from:myId,name:myName,color:myColor}),700);
    setTimeout(()=>{if(!lobbyIn)setSb('sSb','Room not found. Check the code!');},7000);
  });
}

//  LOBBY
// ══════════════════════════════════════════════════════════════
function lobbyPay(extra={}){return{players,maxPlayers,mapIdx:selectedMap,duration:gameDur,gameStarted:false,...extra};}
function goLobby(){
  SHOW('lobbyScr');$('lobbyCode').textContent=roomCode;$('lMV').textContent=maxPlayers;
  if(isHost){$('hCtrls').style.display='flex';$('startWrap').style.display='block';}
  renderLobby();
  window.addEventListener('beforeunload',()=>pub(T().leave,{from:myId}));
}
function renderLobby(){
  if(!$('lobbyScr').classList.contains('on')&&$('lobbyScr').style.display!=='flex')return;
  const entries=Object.entries(players);
  const list=$('pList');list.innerHTML='';
  entries.forEach(([id,p])=>{
    const d=document.createElement('div');d.className='pslot f';
    d.innerHTML=`<span class="pdot" style="background:${p.color}"></span>
      <span>${ESC(p.name)}</span>${p.isHost?'<span class="pbadge">HOST</span>':''}`;
    list.appendChild(d);
  });
  for(let i=entries.length;i<maxPlayers;i++){
    const d=document.createElement('div');d.className='pslot e';
    d.textContent=`Waiting for player ${i+1}…`;list.appendChild(d);
  }
  $('pct').textContent=`${entries.length} / ${maxPlayers} Players`;
  if(isHost){
    const rdy=entries.length>=2;
    $('startBtn').disabled=!rdy;
    $('startBtn').textContent=rdy?'🏁 START GAME!':'NEED '+(2-entries.length)+' MORE PLAYER'+(entries.length<1?'S':'');
  }
}
function startOnlineGame(){
  const ids=Object.keys(players);
  itId=ids[Math.floor(Math.random()*ids.length)];
  gameDur=onlineDurVal;endTime=Date.now()+gameDur*60*1000;
  const sd={itPlayer:itId,duration:gameDur,endTime,mapIdx:selectedMap,order:players};
  pub(T().start,sd);pub(T().state,{...lobbyPay(),gameStarted:true,...sd},true);
  gStarted=true;
  ids.forEach((id,i)=>spawnOnline(id,players[id].name,players[id].color,id===itId,i));
  countdown(()=>beginGame());
}

const SPAWNS=[

  {x:350,y:GROUND_Y-30},{x:610,y:GROUND_Y-30},
  {x:240,y:GROUND_Y-30},{x:720,y:GROUND_Y-30},
  {x:480,y:GROUND_Y-30},{x:480,y:GROUND_Y-130},
];

function makePS(id,name,color,isIt,idx){
  const sp=SPAWNS[idx%SPAWNS.length];
  return{x:sp.x,y:sp.y,vx:0,vy:0,grounded:false,
    isIt,score:0,taggedAt:isIt?Date.now():0,
    name,color,fr:true,
    tx:sp.x,ty:sp.y,tvx:0,seen:Date.now(),
    ctrlIdx:-1};
}

function spawnOnline(id,name,color,isIt,idx){
  gs[id]=makePS(id,name,color,isIt,idx);
}
function initRemote(pid,x,y){
  const p=players[pid];
  gs[pid]={x,y,vx:0,vy:0,grounded:false,isIt:pid===itId,score:0,taggedAt:0,
    name:p?.name||'?',color:p?.color||'#ccc',fr:true,tx:x,ty:y,tvx:0,seen:Date.now(),ctrlIdx:-1};
}

function spawnLocal(){
  localPlayers=[];
  const pNames=['Player 1','Player 2','Player 3','Player 4'];
  for(let i=0;i<localCount;i++){
    const id='local_'+i;
    const p=makePS(id,pNames[i],PCOLORS[i],i===0,i);
    p.ctrlIdx=i;
    gs[id]=p;
    localPlayers.push(id);
  }
  itId=localPlayers[0];
  gs[itId].isIt=true;gs[itId].taggedAt=Date.now();
}

function countdown(cb){
  SHOW('cntScr');const el=$('cntC');let n=3;
  (function tick(){
    el.innerHTML=n>0?`<div class="bigN">${n}</div>`:`<div class="goT">GO!</div>`;
    n>0?setTimeout(()=>{n--;tick();},900):setTimeout(cb,700);
  })();
}

// ══════════════════════════════════════════════════════════════
//  BEGIN GAME
// ══════════════════════════════════════════════════════════════
function beginGame(){
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  SHOW('gameScr');
  gameDur=gameDur||localDurVal;
  endTime=endTime||Date.now()+localDurVal*60*1000;
  lastTs=performance.now();
  rafId=requestAnimationFrame(loop);
}

function resizeCanvas(){
  cw=window.innerWidth; ch=window.innerHeight;
  canvas.width=cw; canvas.height=ch;
  worldScale=cw/WW;
}

// ══════════════════════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════════════════════
function loop(ts){
  if(gEnded)return;
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;

  if(gameMode==='local'){
    localPlayers.forEach(id=>movePlayer(id,dt));
    checkLocalTag();
  } else {
    movePlayer(myId,dt);
    lerpRemotes(dt);
    checkOnlineTag();
  }

  updateCamera();
  updateHUD();
  draw();

  if(ts-posLast>POS_MS&&gameMode==='online'){
    posLast=ts;broadcastPos();
  }
  if((isHost||gameMode==='local')&&Date.now()>endTime)hostEnd();
  rafId=requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════════════════
//  PHYSICS
// ══════════════════════════════════════════════════════════════
function movePlayer(id,dt){
  const p=gs[id];if(!p)return;
  const plats=MAPS[selectedMap].platforms;
  let dx=0;

  if(gameMode==='local'){
    const ctrl=LOCAL_CTRL[p.ctrlIdx];
    if(keys[ctrl.left]) dx=-1;
    if(keys[ctrl.right])dx= 1;
  } else {
    if(keys['a']||keys['A']||keys['ArrowLeft']) dx=-1;
    if(keys['d']||keys['D']||keys['ArrowRight'])dx= 1;
  }

  const spd=p.isIt?IT_SPD:PSPEED;
  p.vx=dx*spd;
  if(dx>0)p.fr=true;
  if(dx<0)p.fr=false;

  p.vy=Math.min(p.vy+GRAV*dt,VTERM);
  const prevY=p.y;
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;

  // Clamp X
  p.x=Math.max(PW,Math.min(WW-PW,p.x));

  // Platform collision
  p.grounded=false;
  for(const pl of plats){
    const pB=p.y+PH,pL=p.x-PW,pR=p.x+PW;
    if(pR>pl.x&&pL<pl.x+pl.w){
      if(p.vy>=0&&prevY+PH<=pl.y+6&&pB>=pl.y&&pB<=pl.y+p.vy*dt+20){
        p.y=pl.y-PH;p.vy=0;p.grounded=true;break;
      }
    }
  }

  // Wrap bottom
  if(p.y>WH+80){p.y=40;p.x=WW/2;p.vy=0;}
}

function tryJump(id){
  const p=gs[id];if(p?.grounded){p.vy=JUMP_V;p.grounded=false;}
}

function lerpRemotes(dt){
  const LR=15;
  Object.entries(gs).forEach(([id,p])=>{
    if(id===myId)return;
    if(p.tx!==undefined){p.x+=(p.tx-p.x)*Math.min(1,LR*dt);p.y+=(p.ty-p.y)*Math.min(1,LR*dt);}
    if(Date.now()-p.seen>8000)delete gs[id];
  });
}

// ══════════════════════════════════════════════════════════════
//  TAG DETECTION
// ══════════════════════════════════════════════════════════════
function checkLocalTag(){
  const now=Date.now();
  const itPlayer=gs[itId];if(!itPlayer)return;
  if(now-itPlayer.taggedAt<TAG_CD)return;
  for(const id of localPlayers){
    if(id===itId)continue;
    const other=gs[id];if(!other)continue;
    const dx=itPlayer.x-other.x,dy=itPlayer.y-other.y;
    if(Math.sqrt(dx*dx+dy*dy)<PW*2+8){
      itPlayer.score=(itPlayer.score||0)+1;
      itPlayer.isIt=false;other.isIt=true;other.taggedAt=now;itId=id;break;
    }
  }
}
function checkOnlineTag(){
  const me=gs[myId];if(!me?.isIt)return;
  const now=Date.now();if(now-me.taggedAt<TAG_CD)return;
  for(const [id,other] of Object.entries(gs)){
    if(id===myId||other.isIt)continue;
    const dx=me.x-other.x,dy=me.y-other.y;
    if(Math.sqrt(dx*dx+dy*dy)<PW*2+8){
      me.isIt=false;me.score=(me.score||0)+1;
      other.isIt=true;other.taggedAt=now;itId=id;
      pub(T().tagged,{from:myId,to:id});break;
    }
  }
}

// ══════════════════════════════════════════════════════════════
//  CAMERA
// ══════════════════════════════════════════════════════════════
function updateCamera(){
  const all=Object.values(gs).filter(p=>p);
  if(!all.length)return;
  // Find center of all players
  const avgY=all.reduce((s,p)=>s+p.y,0)/all.length;
  // Camera tries to keep avgY in center of screen (in world coords)
  const targetCamY=avgY/worldScale-ch*0.55;
  const maxCamY=(WH*worldScale-ch)/worldScale;
  const clampedTarget=Math.max(0,Math.min(maxCamY,targetCamY));
  camY+=(clampedTarget-camY)*0.1;
}

// ══════════════════════════════════════════════════════════════
//  HUD
// ══════════════════════════════════════════════════════════════
function updateHUD(){
  const rem=Math.max(0,endTime-Date.now());
  const frac=rem/(gameDur*60*1000);
  $('timeFill').style.width=(frac*100)+'%';
  const min=Math.floor(rem/60000),sec=Math.floor((rem%60000)/1000);
  $('timeTxt').textContent=`${min}:${sec.toString().padStart(2,'0')}`;
  const sorted=Object.entries(gs).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
  $('hudSc').innerHTML=sorted.slice(0,6).map(([id,p])=>{
    const isMe=gameMode==='local'?false:id===myId;
    return`<span class="hsc${isMe?' me':''}" style="border-color:${p.color};color:${isMe?p.color:'#334'}">
      ${ESC(p.name)}: ${p.score||0}</span>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
//  DRAW
// ══════════════════════════════════════════════════════════════
function draw(){
  const m=MAPS[selectedMap];
  const s=worldScale;
  const ox=0, oy=-camY*s;  // world-to-screen offset

  ctx.clearRect(0,0,cw,ch);

  // Sky gradient
  const sk=ctx.createLinearGradient(0,0,0,ch);
  sk.addColorStop(0,m.sky0);sk.addColorStop(1,m.sky1);
  ctx.fillStyle=sk;ctx.fillRect(0,0,cw,ch);

  // Background elements (parallax)
  drawBgDecos(ctx,m,ox*0.3,oy*0.5,s*0.85);

  // Platforms
  m.platforms.forEach(pl=>drawPlatform(ctx,pl,m,ox,oy,s));

  // Foreground decos
  drawFgDecos(ctx,m,ox,oy,s);

  // Players
  Object.entries(gs).forEach(([id,p])=>{
    drawChar(ctx,p,gameMode==='local'?false:id===myId,ox,oy,s);
  });

  // World boundary flash
  ctx.strokeStyle='rgba(232,84,122,0.35)';
  ctx.lineWidth=4;
  ctx.strokeRect(ox,oy,WW*s,WH*s);
}

function wx(x,ox,s){return x*s+ox;}
function wy(y,oy,s){return y*s+oy;}

// ══════════════════════════════════════════════════════════════
//  PLATFORM DRAWING
// ══════════════════════════════════════════════════════════════
function drawPlatform(ctx,pl,m,ox,oy,s){
  const {x,y,w,h,ground}=pl;
  const sx=wx(x,ox,s),sy=wy(y,oy,s),sw=w*s,sh=h*s;
  if(sy>ch+20||sy+sh<-20)return; // cull off-screen

  if(ground){
    ctx.fillStyle=m.groundFill; ctx.fillRect(sx,sy,sw,sh);
    ctx.fillStyle=m.groundTop;  ctx.fillRect(sx,sy,sw,16*s);
    ctx.fillStyle=m.groundBump;
    for(let bx=sx+18*s;bx<sx+sw-8*s;bx+=36*s){
      ctx.beginPath();ctx.ellipse(bx,sy,7*s,6*s,0,0,Math.PI);ctx.fill();
    }
  } else {
    // Shadow
    ctx.fillStyle=m.platShadow;
    rRect(ctx,sx+3,sy+4*s,sw,sh,5*s);ctx.fill();
    // Body
    ctx.fillStyle=m.platFill;
    rRect(ctx,sx,sy+4*s,sw,sh-4*s,4*s);ctx.fill();
    // Top
    ctx.fillStyle=m.platTop;
    rRect(ctx,sx,sy,sw,9*s,4*s);ctx.fill();
    // Highlight
    ctx.fillStyle='rgba(255,255,255,0.3)';
    rRect(ctx,sx+4*s,sy+2*s,sw-8*s,4*s,2*s);ctx.fill();
    // Underside stripes
    ctx.fillStyle='rgba(0,0,0,0.08)';
    for(let i=0;i<3;i++){
      const bx=sx+12*s+i*Math.floor(sw/4);
      ctx.fillRect(bx,sy+10*s,3*s,sh-8*s);
    }
  }
}

function rRect(ctx,x,y,w,h,r){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

// ══════════════════════════════════════════════════════════════
//  CHARACTER DRAWING
// ══════════════════════════════════════════════════════════════
function drawChar(ctx,p,isMe,ox,oy,s){
  const sx=wx(p.x,ox,s),sy=wy(p.y,oy,s);
  if(sy<-80*s||sy>ch+80*s)return;
  const W=PW*s,H=PH*s;
  const now=Date.now();
  const grace=p.isIt&&(now-p.taggedAt<TAG_CD);

  ctx.save();

  // Shadow on ground
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.ellipse(sx,sy+H+2*s,W*0.8,4*s,0,0,Math.PI*2);ctx.fill();

  if(p.isIt){ctx.shadowColor='#e8547a';ctx.shadowBlur=16;}
  if(grace)ctx.globalAlpha=0.45+0.55*(Math.floor(now/90)%2);

  // Body blob
  ctx.fillStyle='#1e2040';
  rRect(ctx,sx-W,sy-H,W*2,H*2,8*s);ctx.fill();

  // Ear spikes
  ctx.fillStyle='#1e2040';
  ctx.beginPath();ctx.moveTo(sx-7*s,sy-H);ctx.lineTo(sx-11*s,sy-H-9*s);ctx.lineTo(sx-3*s,sy-H);ctx.fill();
  ctx.beginPath();ctx.moveTo(sx+3*s,sy-H);ctx.lineTo(sx+11*s,sy-H-9*s);ctx.lineTo(sx+7*s,sy-H);ctx.fill();

  ctx.shadowBlur=0;

  // Headband
  ctx.fillStyle=p.color;
  rRect(ctx,sx-W-2,sy-H+6*s,W*2+4,7*s,2*s);ctx.fill();
  // Headband tail
  const kx=p.fr?sx+W:sx-W;
  ctx.beginPath();
  ctx.moveTo(kx,sy-H+5*s);ctx.lineTo(kx+(p.fr?7:-7)*s,sy-H);
  ctx.lineTo(kx+(p.fr?5:-5)*s,sy-H+14*s);ctx.lineTo(kx,sy-H+14*s);ctx.fill();

  // Eyes
  const eo=(p.fr?1.5:-1.5)*s;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(sx-5*s+eo,sy-1*s,4*s,5.5*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+5*s+eo,sy-1*s,4*s,5.5*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.ellipse(sx-4*s+eo,sy,2.2*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+6*s+eo,sy,2.2*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(sx-3*s+eo,sy-2*s,1*s,1*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(sx+7*s+eo,sy-2*s,1*s,1*s,0,0,Math.PI*2);ctx.fill();

  // Beard
  ctx.fillStyle='#2a2e50';
  ctx.beginPath();ctx.ellipse(sx,sy+H-3*s,5*s,3.5*s,0,0,Math.PI*2);ctx.fill();

  ctx.globalAlpha=1;

  // IT indicator
  if(p.isIt){
    const t=now*0.006;
    for(let i=0;i<5;i++){
      const a=t+i*Math.PI*2/5,r=(W+7*s)+Math.sin(t*2+i)*2*s;
      ctx.fillStyle=i%2===0?'#e8547a':'#ff9fbd';
      ctx.beginPath();ctx.arc(sx+Math.cos(a)*r,sy+Math.sin(a)*r,2.5*s,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='#e8547a';
    ctx.font=`bold ${9*s}px Nunito,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('IT!',sx,sy-H-12*s);
  }

  // Score
  if(p.score>0){
    ctx.fillStyle=p.color;
    ctx.font=`bold ${9*s}px Nunito,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText('×'+p.score,sx,sy-H-(p.isIt?22:12)*s);
  }

  // Name tag
  ctx.font=`${isMe?'bold ':''}${10*s}px Nunito,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='bottom';
  const ny=sy-H-(p.isIt?34:22)*s;
  const tw=ctx.measureText(p.name).width;
  ctx.fillStyle='rgba(255,255,255,0.88)';
  rRect(ctx,sx-tw/2-4,ny-13*s,tw+8,13*s,3*s);ctx.fill();
  ctx.fillStyle=isMe?p.color:'#334';
  ctx.fillText(p.name,sx,ny);

  // You ring
  if(isMe){
    ctx.strokeStyle=p.color;ctx.lineWidth=2*s;
    ctx.setLineDash([5*s,3*s]);
    ctx.beginPath();ctx.arc(sx,sy,W+6*s,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

// ══════════════════════════════════════════════════════════════
//  DECORATION DRAWING
// ══════════════════════════════════════════════════════════════
function drawBgDecos(ctx,m,ox,oy,s){
  const mi=selectedMap;
  if(mi===0||mi===1){  // forest / winter — columns
    const colY=oy+GROUND_Y*worldScale;
    const colH=200*worldScale;
    ctx.fillStyle='rgba(140,200,230,0.38)';
    [160,380,600,800].forEach(cx=>{
      const sx=wx(cx,ox,worldScale*0.4);
      ctx.fillRect(sx-12*s,colY-colH,24*s,colH);
      ctx.fillRect(sx-18*s,colY-colH,36*s,18*s);
      ctx.fillRect(sx-18*s,colY-14,36*s,14);
      // capital details
      for(let ry=colY-colH+22*s;ry<colY-14;ry+=22*s){
        ctx.fillStyle='rgba(130,190,220,0.28)';
        ctx.fillRect(sx-13*s,ry,26*s,3*s);
        ctx.fillStyle='rgba(140,200,230,0.38)';
      }
    });
  }
  if(mi===3){ // space — star field
    ctx.fillStyle='rgba(255,255,255,0.7)';
    [[80,200],[200,120],[400,80],[600,160],[800,240],[100,400],[700,320],[350,300],
     [550,480],[900,400],[160,600],[820,560],[450,700],[260,800]].forEach(([bx,by])=>{
      const ss=wx(bx,ox*0.2,worldScale*0.4),sy2=wy(by,oy*0.2,worldScale*0.4);
      if(sy2>-10&&sy2<ch+10){
        ctx.beginPath();ctx.arc(ss,sy2,1.5,0,Math.PI*2);ctx.fill();
      }
    });
  }
}

function drawFgDecos(ctx,m,ox,oy,s){
  m.decos.forEach(d=>{
    const sx=wx(d.x,ox,s),sy=wy(d.y,oy,s);
    if(sy<-200*s||sy>ch+200*s)return;
    const sc=(d.scale||1)*s;
    switch(d.type){
      case'tree':    drawTree(ctx,sx,sy,sc);break;
      case'pillar':  drawPillar(ctx,sx,sy,sc);break;
      case'mushroom':drawMushroom(ctx,sx,sy,sc);break;
      case'bush':    drawBush(ctx,sx,sy,sc);break;
      case'box':     drawBox(ctx,sx,sy,sc);break;
      case'snowman': drawSnowman(ctx,sx,sy,sc);break;
      case'snowpine':drawSnowPine(ctx,sx,sy,sc);break;
      case'xmas':    drawXmas(ctx,sx,sy,sc);break;
      case'icicle':  drawIcicle(ctx,sx,sy,sc);break;
      case'cactus':  drawCactus(ctx,sx,sy,sc);break;
      case'pyramid': drawPyramid(ctx,sx,sy,sc,d.scale||1);break;
      case'sphinx':  drawSphinx(ctx,sx,sy,sc);break;
      case'planet':  drawPlanet(ctx,wx(d.x,ox,s),wy(d.by||d.y||300,oy,s),d.r*s);break;
      case'rocket':  drawRocket(ctx,sx,sy,sc);break;
    }
  });
}

function drawTree(ctx,x,y,s){
  ctx.fillStyle='#8b4513';ctx.fillRect(x-6*s,y-50*s,12*s,50*s);
  ctx.fillStyle='#4a8a2a';ctx.beginPath();ctx.arc(x,y-55*s,30*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5aaa3a';ctx.beginPath();ctx.arc(x-14*s,y-42*s,22*s,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+14*s,y-42*s,22*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6aba4a';ctx.beginPath();ctx.arc(x+6*s,y-60*s,16*s,0,Math.PI*2);ctx.fill();
}
function drawPillar(ctx,x,y,s){
  ctx.fillStyle='rgba(150,210,240,0.5)';
  ctx.fillRect(x-10*s,y-120*s,20*s,120*s);
  ctx.fillRect(x-14*s,y-120*s,28*s,16*s);
  ctx.fillRect(x-14*s,y-12*s,28*s,12*s);
}
function drawMushroom(ctx,x,y,s){
  ctx.fillStyle='#ddd';ctx.fillRect(x-4*s,y-20*s,8*s,20*s);
  ctx.fillStyle='#e8547a';ctx.beginPath();ctx.ellipse(x,y-20*s,16*s,14*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.7)';
  [[0,-5],[8,-3],[-7,-4]].forEach(([dx,dy])=>{ctx.beginPath();ctx.ellipse(x+dx*s,y+dy*s+(-(20-4)*s),4*s,3*s,0,0,Math.PI*2);ctx.fill();});
}
function drawBush(ctx,x,y,s){
  ctx.fillStyle='#4a9a2a';
  ctx.beginPath();ctx.ellipse(x,y-12*s,20*s,14*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x-14*s,y-10*s,15*s,12*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+14*s,y-10*s,15*s,12*s,0,0,Math.PI*2);ctx.fill();
}
function drawBox(ctx,x,y,s){
  ctx.fillStyle='#d4820a';rRect(ctx,x-14*s,y-28*s,28*s,28*s,4*s);ctx.fill();
  ctx.fillStyle='#e89218';rRect(ctx,x-14*s,y-28*s,28*s,10*s,4*s);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=2*s;
  ctx.beginPath();ctx.moveTo(x,y-28*s);ctx.lineTo(x,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-14*s,y-14*s);ctx.lineTo(x+14*s,y-14*s);ctx.stroke();
}
function drawSnowman(ctx,x,y,s){
  ctx.fillStyle='#e8eef8';
  ctx.beginPath();ctx.ellipse(x,y-16*s,14*s,14*s,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(x,y-36*s,10*s,10*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.fillRect(x-8*s,y-50*s,16*s,12*s);
  ctx.fillStyle='#444';[[-4,-33],[0,-33],[4,-33]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,1.5*s,0,Math.PI*2);ctx.fill();});
  ctx.strokeStyle='#e8547a';ctx.lineWidth=3*s;
  ctx.beginPath();ctx.moveTo(x-20*s,y-30*s);ctx.lineTo(x-10*s,y-32*s);ctx.moveTo(x+10*s,y-32*s);ctx.lineTo(x+20*s,y-30*s);ctx.stroke();
}
function drawSnowPine(ctx,x,y,s){
  ctx.fillStyle='#8b4513';ctx.fillRect(x-4*s,y-50*s,8*s,50*s);
  [[0,48,22],[0,35,18],[0,24,14]].forEach(([bx,by,r])=>{
    ctx.fillStyle='#2a6a3a';ctx.beginPath();ctx.arc(x+bx*s,y-by*s,r*s,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(220,235,255,0.6)';ctx.fillRect(x-r*s,y-by*s-3*s,r*2*s,8*s);
  });
}
function drawXmas(ctx,x,y,s){
  ctx.fillStyle='#2a7a3a';
  ctx.beginPath();ctx.moveTo(x,y-30*s);ctx.lineTo(x-18*s,y);ctx.lineTo(x+18*s,y);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,y-46*s);ctx.lineTo(x-13*s,y-20*s);ctx.lineTo(x+13*s,y-20*s);ctx.fill();
  const lights=[[-10,0],[5,-8],[10,-20],[0,-30],[-7,-20]];
  lights.forEach(([dx,dy],i)=>{
    const lc=['#ffd24a','#e8547a','#4fc3f7','#81c784'][i%4];
    ctx.fillStyle=lc;ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,3*s,0,Math.PI*2);ctx.fill();
  });
}
function drawIcicle(ctx,x,y,s){
  for(let i=0;i<3;i++){
    ctx.fillStyle='rgba(200,230,255,0.8)';
    ctx.beginPath();ctx.moveTo(x+i*12*s-8*s,y);ctx.lineTo(x+i*12*s+8*s,y);
    ctx.lineTo(x+i*12*s,(y+24*s));ctx.fill();
  }
}
function drawCactus(ctx,x,y,s){
  ctx.fillStyle='#5a9a30';
  ctx.fillRect(x-6*s,y-60*s,12*s,60*s);
  ctx.fillRect(x-22*s,y-46*s,18*s,12*s);ctx.fillRect(x+4*s,y-38*s,18*s,12*s);
  ctx.fillRect(x-28*s,y-46*s,6*s,28*s);ctx.fillRect(x+22*s,y-38*s,6*s,22*s);
  ctx.fillStyle='#4a8a22';
  ctx.fillRect(x-5*s,y-60*s,4*s,60*s);
}
function drawPyramid(ctx,x,y,s,sc=1){
  const pw=70*sc; const ph=60*sc;
  ctx.fillStyle='#c8902a';
  ctx.beginPath();ctx.moveTo(x,y-ph*s);ctx.lineTo(x-pw*s,y);ctx.lineTo(x+pw*s,y);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.beginPath();ctx.moveTo(x,y-ph*s);ctx.lineTo(x+pw*s,y);ctx.lineTo(x,y);ctx.fill();
}
function drawSphinx(ctx,x,y,s){
  ctx.fillStyle='#d4a040';
  ctx.fillRect(x-40*s,y-35*s,80*s,35*s);
  ctx.fillRect(x-20*s,y-55*s,35*s,20*s);
  rRect(ctx,x-18*s,y-68*s,30*s,15*s,4*s);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();ctx.arc(x-10*s,y-52*s,4*s,0,Math.PI*2);ctx.fill();
}
function drawPlanet(ctx,x,y,r){
  const grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
  grad.addColorStop(0,'#9966dd');grad.addColorStop(1,'#331166');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(200,150,255,0.4)';ctx.lineWidth=r*0.4;
  ctx.beginPath();ctx.ellipse(x,y,r*1.6,r*0.3,-0.3,0,Math.PI*2);ctx.stroke();
}
function drawRocket(ctx,x,y,s){
  ctx.fillStyle='#ddd';ctx.fillRect(x-8*s,y-50*s,16*s,40*s);
  ctx.fillStyle='#e8547a';
  ctx.beginPath();ctx.moveTo(x,y-70*s);ctx.lineTo(x-8*s,y-50*s);ctx.lineTo(x+8*s,y-50*s);ctx.fill();
  ctx.fillStyle='#4fc3f7';ctx.beginPath();ctx.ellipse(x,y-38*s,6*s,6*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f80';
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*6*s,y-10*s);ctx.lineTo(x+i*6*s-3*s,y+15*s);ctx.lineTo(x+i*6*s+3*s,y+15*s);ctx.fill();}
}

// ══════════════════════════════════════════════════════════════
//  BROADCAST (online)
// ══════════════════════════════════════════════════════════════
function broadcastPos(){
  const me=gs[myId];if(!me)return;
  pub(posT(myId),{x:me.x,y:me.y,vx:me.vx,vy:me.vy,isIt:me.isIt,score:me.score||0,fr:me.fr});
}

// ══════════════════════════════════════════════════════════════
//  END GAME
// ══════════════════════════════════════════════════════════════
function hostEnd(){
  if(gEnded)return;
  const scores={};
  Object.entries(gs).forEach(([id,p])=>scores[id]={name:p.name,color:p.color,score:p.score||0});
  if(gameMode==='online')pub(T().end,{scores});
  showEnd(scores);
}
function showEnd(scores){
  if(gEnded)return;gEnded=true;
  cancelAnimationFrame(rafId);
  const sorted=Object.entries(scores).sort((a,b)=>b[1].score-a[1].score);
  const [wId,wP]=sorted[0];
  $('endTitle').textContent=gameMode==='online'&&wId===myId?'🏆 YOU WIN!':ESC(wP.name)+' WINS!';
  const sb=$('sbrd');sb.innerHTML='';
  const medals=['🥇','🥈','🥉'];
  sorted.forEach(([id,s],i)=>{
    const r=document.createElement('div');r.className='srow'+(i===0?' win':'');
    const isMe=gameMode==='local'?false:id===myId;
    r.innerHTML=`<span class="srank">${medals[i]||''}</span>
      <span class="sname" style="color:${s.color}">${ESC(s.name)}${isMe?' (you)':''}</span>
      <span class="stag">${s.score} tag${s.score!==1?'s':''}</span>`;
    sb.appendChild(r);
  });
  SHOW('endScr');
}

// ══════════════════════════════════════════════════════════════
//  KEYBOARD
// ══════════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  const k=e.key; keys[k]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();

  // Jump keys
  if(!gEnded&&gStarted){
    if(gameMode==='local'){
      localPlayers.forEach(id=>{
        const ctrl=LOCAL_CTRL[gs[id]?.ctrlIdx];
        if(ctrl&&k===ctrl.jump)tryJump(id);
      });
    } else {
      if(k==='w'||k==='W'||k==='ArrowUp')tryJump(myId);
    }
  }
});
document.addEventListener('keyup',e=>{ keys[e.key]=false; });

// ══════════════════════════════════════════════════════════════
//  LOCAL CONTROLS TABLE
// ══════════════════════════════════════════════════════════════
function buildCtrlTable(n){
  const tbl=$('ctrlTbl');tbl.innerHTML='';
  for(let i=0;i<n;i++){
    const c=LOCAL_CTRL[i];
    const row=document.createElement('tr');row.className='ctrlRow';
    const lKey=c.left==='ArrowLeft'?'←':c.left.toUpperCase();
    const rKey=c.right==='ArrowRight'?'→':c.right.toUpperCase();
    const jKey=c.jump==='ArrowUp'?'↑':c.jump.toUpperCase();
    row.innerHTML=`<td><span class="pdot" style="background:${PCOLORS[i]};display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px"></span>P${i+1}</td>
      <td>${lKey.length>1?`<span class="ctrlKey">${lKey}</span>`:`<span class="ctrlKey">${lKey}</span>`} / <span class="ctrlKey">${rKey}</span> move &nbsp; <span class="ctrlKey">${jKey}</span> jump</td>`;
    tbl.appendChild(row);
  }
}

// ══════════════════════════════════════════════════════════════
//  UI WIRING
// ══════════════════════════════════════════════════════════════
// Mode select
$('localModeBtn').onclick=()=>{gameMode='local';SHOW('localScr');buildCtrlTable(localCount);};
$('onlineModeBtn').onclick=()=>{gameMode='online';SHOW('onlineScr');probeConn();};

// Back buttons
$('backLocal').onclick=()=>SHOW('modeScr');
$('backOnline').onclick=()=>SHOW('modeScr');
$('backMap').onclick=()=>SHOW(fromScreen);
$('backLobby').onclick=()=>{pub(T().leave,{from:myId});SHOW('mapScr');};

// Local player count
document.querySelectorAll('.pcBtn').forEach(btn=>{
  btn.onclick=()=>{
    localCount=parseInt(btn.dataset.n);
    document.querySelectorAll('.pcBtn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    buildCtrlTable(localCount);
  };
});
$('localNextBtn').onclick=()=>{fromScreen='localScr';buildMapGrid();SHOW('mapScr');};
$('mapNextBtn').onclick=()=>{
  if(gameMode==='local'){
    gameDur=localDurVal;endTime=Date.now()+gameDur*60*1000;
    spawnLocal();
    countdown(()=>beginGame());
  } else {
    // Online: go to lobby
    goLobby();
  }
};

// Duration (local)
$('ldMin').onclick=()=>{localDurVal=Math.max(1,localDurVal-1);$('ldV').textContent=localDurVal;};
$('ldMax').onclick=()=>{localDurVal=Math.min(10,localDurVal+1);$('ldV').textContent=localDurVal;};

// Online tabs
$('tabH').onclick=()=>{$('tabH').classList.add('on');$('tabJ').classList.remove('on');$('pH').classList.add('on');$('pJ').classList.remove('on');};
$('tabJ').onclick=()=>{$('tabJ').classList.add('on');$('tabH').classList.remove('on');$('pJ').classList.add('on');$('pH').classList.remove('on');};

// Online adjusters
$('mMin').onclick=()=>{localMax=Math.max(2,localMax-1);$('mV').textContent=localMax;};
$('mMax').onclick=()=>{localMax=Math.min(8,localMax+1);$('mV').textContent=localMax;};
$('odMin').onclick=()=>{onlineDurVal=Math.max(1,onlineDurVal-1);$('odV').textContent=onlineDurVal;};
$('odMax').onclick=()=>{onlineDurVal=Math.min(10,onlineDurVal+1);$('odV').textContent=onlineDurVal;};

// Online host/join
$('hostBtn').onclick=()=>{
  hostRoom();
  fromScreen='onlineScr';
  buildMapGrid();
  // For host: after room created, go to map select, then lobby
  // Override: go straight to map select which then goes to lobby
  setTimeout(()=>{ if(mqc?.connected){ SHOW('mapScr'); $('mapNextBtn').onclick=()=>{goLobby();}; }},200);
};
$('joinBtn').onclick=joinRoom;

// Online lobby
$('lMin').onclick=()=>{maxPlayers=Math.max(Math.max(2,Object.keys(players).length),maxPlayers-1);$('lMV').textContent=maxPlayers;if(isHost)pub(T().state,lobbyPay(),true);renderLobby();};
$('lMax').onclick=()=>{maxPlayers=Math.min(8,maxPlayers+1);$('lMV').textContent=maxPlayers;if(isHost)pub(T().state,lobbyPay(),true);renderLobby();};
$('startBtn').onclick=startOnlineGame;
$('cpyBtn').onclick=()=>{
  navigator.clipboard.writeText(roomCode).then(()=>{
    $('cpyBtn').textContent='COPIED!';setTimeout(()=>$('cpyBtn').textContent='COPY',2000);
  }).catch(()=>prompt('Copy this code:',roomCode));
};

// End screen
$('playAgainBtn').onclick=()=>{
  cancelAnimationFrame(rafId);
  gStarted=false;gEnded=false;Object.keys(gs).forEach(k=>delete gs[k]);
  itId='';endTime=0;camY=0;
  if(gameMode==='local'){
    gameDur=localDurVal;endTime=Date.now()+gameDur*60*1000;
    spawnLocal();countdown(()=>beginGame());
  } else {
    if(isHost){pub(T().state,lobbyPay(),true);}
    lobbyIn=isHost;
    SHOW('lobbyScr');renderLobby();
  }
};
$('menuBtn').onclick=()=>{
  cancelAnimationFrame(rafId);
  gStarted=false;gEnded=false;Object.keys(gs).forEach(k=>delete gs[k]);
  itId='';endTime=0;camY=0;gameMode='';
  if(mqc){pub(T().leave,{from:myId});mqc.end(true);mqc=null;}
  lobbyIn=false;isHost=false;players={};roomCode='';
  SHOW('modeScr');
};

// Input
$('jCode').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);});
$('hName').addEventListener('keydown',e=>e.key==='Enter'&&$('hostBtn').click());
$('jCode').addEventListener('keydown',e=>e.key==='Enter'&&$('joinBtn').click());

// Initial dot
function probeConn(){
  if(mqc)return;
  const c=mqtt.connect(BROKER,{clientId:'prb_'+Math.random().toString(36).slice(2),clean:true,connectTimeout:8000,reconnectPeriod:0});
  setDot('wait');
  c.on('connect',()=>{setDot('on');$('clabel').textContent='Ready!';c.end(true);});
  c.on('error',()=>{setDot('');$('clabel').textContent='Network unavailable';});
}

// Init
buildCtrlTable(2);
document.querySelector('.pcBtn[data-n="2"]').classList.add('on');
buildMapGrid();
</script>
</body>
